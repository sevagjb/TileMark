name: Build image

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt pytest pyyaml
      - run: pytest -q

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # main -> :edge (to try what is coming). A v1.2.3 tag -> :1.2.3, :1.2 and :latest,
          # so people on :latest only ever get a tested release.
          flavor: |
            latest=false
          tags: |
            type=raw,value=edge,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # After a release image exists, point the Home Assistant add-on at it. Doing this
  # here (instead of by hand in a pull request) means Home Assistant never offers an
  # add-on version whose image has not been pushed yet.
  addon-version:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Set add-on version and changelog
        run: |
          version="${GITHUB_REF_NAME#v}"
          grep -q "^## ${version}\b" CHANGELOG.md || { echo "CHANGELOG.md has no '## ${version}' section"; exit 1; }
          sed -i -E "s/^version: .*/version: \"${version}\"/" homeassistant-addon/config.yaml
          sed -i -E "s/^## ${version} \(unreleased\)/## ${version}/" CHANGELOG.md
          cp CHANGELOG.md homeassistant-addon/CHANGELOG.md
          if git diff --quiet; then echo "Add-on already at ${version}"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Home Assistant add-on: version ${version}"
          git push origin HEAD:main
