name: Lint Home Assistant app

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  app-linter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The linter the Home Assistant community uses for app folders (config.yaml schema,
      # deprecated and obsolete keys).
      - uses: frenck/action-addon-linter@v2.21.2
        with:
          path: ./homeassistant-addon
