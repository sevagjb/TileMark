services:
  linkboard:
    image: ghcr.io/sevagjb/linkboard:latest
    # To build from source instead of pulling the image, replace the line
    # above with these two:
    # build: https://github.com/sevagjb/linkboard.git#main
    # pull_policy: build
    container_name: linkboard
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./data:/data
