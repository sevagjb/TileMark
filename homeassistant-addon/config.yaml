# Home Assistant app (formerly "add-on") for TileMark. It runs the same image as the Docker
# install (ghcr.io/sevagjb/tilemark:<version>), so "version" must be a released TileMark version.
# Do not change "version" by hand: when a v* tag has been built and pushed, the release
# workflow sets it (and copies CHANGELOG.md here), so Home Assistant never offers an
# update whose image does not exist yet.
name: TileMark
version: "2.4.5"
slug: tilemark
description: Your saved links, with thumbnails and groups, in the Home Assistant sidebar.
url: https://github.com/sevagjb/tilemark
arch:
  - aarch64
  - amd64
image: ghcr.io/sevagjb/tilemark
# Open from the sidebar; Home Assistant signs people in. Every HA user gets their
# own TileMark account, so the panel is not limited to admins.
ingress: true
ingress_port: 8080
panel_icon: mdi:bookmark-multiple
panel_title: TileMark
panel_admin: false
# TileMark's own address, for the browser button, the phone app and the API key.
# Off until a port is filled in under Configuration → Network.
ports:
  8080/tcp: null
ports_description:
  8080/tcp: TileMark's own address (browser button, phone app, API key). Leave empty to use only the sidebar.
# Lets TileMark find Home Assistant's MQTT broker for its sensors (used only when MQTT is on
# and no broker is filled in under TileMark's Settings → Home Assistant sensors).
services:
  - mqtt:want
environment:
  TILEMARK_HA_ADDON: "1"
# No "watchdog" line: the image has a Docker HEALTHCHECK on /healthz, and Home Assistant
# restarts the app when that check reports it unhealthy (when Watchdog is on, on the Info tab).
# Stopped for a moment while Home Assistant makes a backup, so the database copy is consistent.
backup: cold
