<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in - TileMark</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 120'><rect width='120' height='120' rx='28' fill='%232f6fe4'/><rect x='22' y='22' width='35' height='35' rx='9' fill='%23fff' opacity='.55'/><rect x='63' y='22' width='35' height='35' rx='9' fill='%23fff' opacity='.55'/><rect x='22' y='63' width='35' height='35' rx='9' fill='%23fff' opacity='.55'/><rect x='63' y='63' width='35' height='35' rx='9' fill='%23fff'/><path d='M77 57h14v26l-7-6-7 6z' fill='%23f5b83d'/></svg>">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root { --bg: #f3f4f7; --panel: #ffffff; --line: #dfe2e8; --text: #1b1f27; --muted: #667085; --accent: #2f6fe4; --danger: #d6453d; color-scheme: light dark; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #14161b; --panel: #1d2028; --line: #2c313c; --text: #e8eaf0; --muted: #98a1b3; --accent: #6ea0ff; --danger: #f0736b; color-scheme: dark; } }
:root[data-theme="dark"] { --bg: #14161b; --panel: #1d2028; --line: #2c313c; --text: #e8eaf0; --muted: #98a1b3; --accent: #6ea0ff; --danger: #f0736b; color-scheme: dark; }
:root[data-theme="light"] { color-scheme: light; }
* { box-sizing: border-box; } [hidden] { display: none !important; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 20px; background: var(--bg); color: var(--text);
       font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
form { width: min(360px, 100%); background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 26px; }
h1 { margin: 0 0 4px; font-size: 20px; } p { margin: 0 0 18px; color: var(--muted); }
label { display: block; font-size: 13px; color: var(--muted); margin: 12px 0 5px; }
input[type=text], input[type=password] { width: 100%; font: inherit; color: inherit; background: var(--bg); border: 1px solid var(--line); border-radius: 9px; padding: 10px 11px; outline: none; }
input:focus { border-color: var(--accent); }
.remember { display: flex; align-items: center; gap: 8px; margin: 14px 0 0; color: var(--text); font-size: 14px; }
button { width: 100%; margin-top: 18px; font: inherit; font-weight: 600; color: #fff; background: var(--accent); border: 0; border-radius: 10px; padding: 11px; cursor: pointer; }
button:disabled { opacity: .6; cursor: default; }
.small { font-size: 13px; color: var(--muted); margin: 6px 0 0; } code { font-size: 12.5px; }
#err { color: var(--danger); font-size: 14px; min-height: 20px; margin: 12px 0 0; }
</style>
</head>
<body>
<form id="f">
  <svg viewBox="0 0 120 120" width="44" height="44" aria-hidden="true" style="display:block;margin-bottom:12px"><rect width="120" height="120" rx="28" fill="#2f6fe4"/><rect x="22" y="22" width="35" height="35" rx="9" fill="#fff" opacity=".55"/><rect x="63" y="22" width="35" height="35" rx="9" fill="#fff" opacity=".55"/><rect x="22" y="63" width="35" height="35" rx="9" fill="#fff" opacity=".55"/><rect x="63" y="63" width="35" height="35" rx="9" fill="#fff"/><path d="M77 57h14v26l-7-6-7 6z" fill="#f5b83d"/></svg>
  <h1>TileMark</h1>
  <p id="intro">Sign in to see your links.</p>
  <div id="codeWrap" hidden><label for="c">Setup code</label><input id="c" type="text" autocomplete="off" spellcheck="false" placeholder="XXXX-XXXX-XXXX" style="text-transform:uppercase;letter-spacing:.08em">
    <p class="small">Printed in the container log: <code>docker logs tilemark</code>, or the log of the stack in Dockge.</p></div>
  <div id="credWrap"><label for="u">Username</label><input id="u" type="text" autocomplete="username" maxlength="60" autofocus required>
  <label for="p" id="pLbl">Password</label><input id="p" type="password" autocomplete="current-password" required></div>
  <div id="tfWrap" hidden><label for="t">Code from your authenticator app</label><input id="t" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="12" spellcheck="false">
    <p class="small">No phone at hand? Enter one of your recovery codes instead.</p></div>
  <div id="p2Wrap" hidden><label for="p2">Repeat the password</label><input id="p2" type="password" autocomplete="new-password"></div>
  <label class="remember" id="rWrap"><input id="r" type="checkbox" checked> Keep me signed in on this device for 30 days</label>
  <div id="err" role="alert"></div>
  <button id="go" type="submit">Sign in</button>
</form>
<script>
try { const t = JSON.parse(localStorage.getItem("tm.settings") || "{}").theme; if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch {}
const $ = id => document.getElementById(id);
let setup = false, second = false;
fetch("api/auth").then(r => r.json()).then(a => {
  if (!a.setup) return;
  setup = true;  // a new installation: the first account is created here and becomes the admin
  document.title = "Set up - TileMark";
  $("intro").textContent = "Welcome! Create the first account. It becomes the admin, who can add more people later.";
  $("codeWrap").hidden = false; $("c").required = true; $("c").focus();
  $("pLbl").textContent = "Password (at least 8 characters)"; $("p").autocomplete = "new-password"; $("p").minLength = 8;
  $("p2Wrap").hidden = false; $("p2").required = true; $("rWrap").hidden = true; $("go").textContent = "Create account";
}).catch(() => {});
$("f").onsubmit = async e => {
  e.preventDefault(); $("err").textContent = "";
  if (setup && $("p").value !== $("p2").value) { $("err").textContent = "The two passwords are not the same."; return; }
  $("go").disabled = true;
  try {
    const r = second
      ? await fetch("api/login/totp", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ code: $("t").value }) })
      : await fetch(setup ? "api/setup" : "api/login", { method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username: $("u").value, password: $("p").value, remember: $("r").checked, code: $("c").value }) });
    if (setup && r.status === 409) { location.reload(); return; }  // someone else finished the setup first
    const d = await r.json().catch(() => ({}));
    if (r.ok && d.totp) {  // password right; two-factor sign-in is on: ask for the code
      second = true; $("credWrap").hidden = $("rWrap").hidden = true; $("tfWrap").hidden = false;
      $("u").required = $("p").required = false; $("intro").textContent = "Two-factor sign-in";
      $("go").textContent = "Continue"; $("go").disabled = false; $("t").focus(); return;
    }
    if (r.ok) { const n = new URLSearchParams(location.search).get("next") || ""; location.href = n.startsWith("/save") ? n.slice(1) : "./"; return; }
    $("err").textContent = d.error || "Could not sign in.";
    if (second && d.restart) { setTimeout(() => location.reload(), 1500); }
    else if (second) { $("t").value = ""; $("t").focus(); }
    else if (!setup) { $("p").value = ""; $("p").focus(); }  // a wrong setup code keeps the chosen passwords
    else if (d.code) $("c").select();
  } catch { $("err").textContent = "Could not reach TileMark."; }
  $("go").disabled = false;
};
</script>
</body>
</html>
