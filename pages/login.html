<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in - LinkBoard</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 120'><rect width='120' height='120' rx='28' fill='%232f6fe4'/><rect x='22' y='22' width='35' height='35' rx='9' fill='%23fff' opacity='.55'/><rect x='63' y='22' width='35' height='35' rx='9' fill='%23fff' opacity='.55'/><rect x='22' y='63' width='35' height='35' rx='9' fill='%23fff' opacity='.55'/><rect x='63' y='63' width='35' height='35' rx='9' fill='%23fff'/><path d='M77 57h14v26l-7-6-7 6z' fill='%23f5b83d'/></svg>">
<link rel="apple-touch-icon" href="/icon-180.png">
<style>
:root { --bg: #f3f4f7; --panel: #ffffff; --line: #dfe2e8; --text: #1b1f27; --muted: #667085; --accent: #2f6fe4; --danger: #d6453d; color-scheme: light dark; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #14161b; --panel: #1d2028; --line: #2c313c; --text: #e8eaf0; --muted: #98a1b3; --accent: #6ea0ff; --danger: #f0736b; color-scheme: dark; } }
:root[data-theme="dark"] { --bg: #14161b; --panel: #1d2028; --line: #2c313c; --text: #e8eaf0; --muted: #98a1b3; --accent: #6ea0ff; --danger: #f0736b; color-scheme: dark; }
:root[data-theme="light"] { color-scheme: light; }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 20px; background: var(--bg); color: var(--text);
       font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
form { width: min(360px, 100%); background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 26px; }
h1 { margin: 0 0 4px; font-size: 20px; } p { margin: 0 0 18px; color: var(--muted); }
label { display: block; font-size: 13px; color: var(--muted); margin: 12px 0 5px; }
input[type=text], input[type=password] { width: 100%; font: inherit; color: inherit; background: var(--bg); border: 1px solid var(--line); border-radius: 9px; padding: 10px 11px; outline: none; }
input:focus { border-color: var(--accent); }
.remember { display: flex; align-items: center; gap: 8px; margin: 14px 0 0; color: var(--text); font-size: 14px; }
button { width: 100%; margin-top: 18px; font: inherit; font-weight: 600; color: #fff; background: var(--accent); border: 0; border-radius: 10px; padding: 11px; cursor: pointer; }
button:disabled { opacity: .6; cursor: default; }
#err { color: var(--danger); font-size: 14px; min-height: 20px; margin: 12px 0 0; }
</style>
</head>
<body>
<form id="f">
  <svg viewBox="0 0 120 120" width="44" height="44" aria-hidden="true" style="display:block;margin-bottom:12px"><rect width="120" height="120" rx="28" fill="#2f6fe4"/><rect x="22" y="22" width="35" height="35" rx="9" fill="#fff" opacity=".55"/><rect x="63" y="22" width="35" height="35" rx="9" fill="#fff" opacity=".55"/><rect x="22" y="63" width="35" height="35" rx="9" fill="#fff" opacity=".55"/><rect x="63" y="63" width="35" height="35" rx="9" fill="#fff"/><path d="M77 57h14v26l-7-6-7 6z" fill="#f5b83d"/></svg>
  <h1>LinkBoard</h1>
  <p>Sign in to see your links.</p>
  <label for="u">Username</label><input id="u" type="text" autocomplete="username" autofocus required>
  <label for="p">Password</label><input id="p" type="password" autocomplete="current-password" required>
  <label class="remember"><input id="r" type="checkbox" checked> Keep me signed in on this device for 30 days</label>
  <div id="err" role="alert"></div>
  <button id="go" type="submit">Sign in</button>
</form>
<script>
try { const t = JSON.parse(localStorage.getItem("lb.settings") || "{}").theme; if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch {}
const $ = id => document.getElementById(id);
$("f").onsubmit = async e => {
  e.preventDefault(); $("err").textContent = ""; $("go").disabled = true;
  try {
    const r = await fetch("/api/login", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username: $("u").value, password: $("p").value, remember: $("r").checked }) });
    const d = await r.json().catch(() => ({}));
    if (r.ok) { location.href = "/"; return; }
    $("err").textContent = d.error || "Could not sign in."; $("p").value = ""; $("p").focus();
  } catch { $("err").textContent = "Could not reach LinkBoard."; }
  $("go").disabled = false;
};
</script>
</body>
</html>
