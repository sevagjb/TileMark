<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Save to TileMark</title>
<link rel="icon" href="icon-192.png">
<style>
:root { --bg: #f3f4f7; --panel: #ffffff; --line: #dfe2e8; --text: #1b1f27; --muted: #667085; --accent: #2f6fe4; --danger: #d6453d; color-scheme: light dark; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #14161b; --panel: #1d2028; --line: #2c313c; --text: #e8eaf0; --muted: #98a1b3; --accent: #6ea0ff; --danger: #f0736b; color-scheme: dark; } }
:root[data-theme="dark"] { --bg: #14161b; --panel: #1d2028; --line: #2c313c; --text: #e8eaf0; --muted: #98a1b3; --accent: #6ea0ff; --danger: #f0736b; color-scheme: dark; }
:root[data-theme="light"] { color-scheme: light; }
* { box-sizing: border-box; } [hidden] { display: none !important; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 20px; background: var(--bg); color: var(--text);
       font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
form { width: min(420px, 100%); background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 26px; }
h1 { margin: 0 0 4px; font-size: 20px; } p { margin: 0 0 18px; color: var(--muted); }
label { display: block; font-size: 13px; color: var(--muted); margin: 12px 0 5px; }
input[type=text], input[type=password] { width: 100%; font: inherit; color: inherit; background: var(--bg); border: 1px solid var(--line); border-radius: 9px; padding: 10px 11px; outline: none; }
input:focus { border-color: var(--accent); }
.remember { display: flex; align-items: center; gap: 8px; margin: 14px 0 0; color: var(--text); font-size: 14px; }
button { width: 100%; margin-top: 18px; font: inherit; font-weight: 600; color: #fff; background: var(--accent); border: 0; border-radius: 10px; padding: 11px; cursor: pointer; }
button:disabled { opacity: .6; cursor: default; }
#err { color: var(--danger); font-size: 14px; min-height: 20px; margin: 12px 0 0; }
</style>
<style>
select, textarea { width: 100%; font: inherit; color: inherit; background: var(--bg); border: 1px solid var(--line); border-radius: 9px; padding: 10px 11px; outline: none; }
select, option { background-color: var(--bg); color: var(--text); }
textarea { min-height: 70px; resize: vertical; }
.url { color: var(--muted); font-size: 13px; overflow-wrap: anywhere; margin: 6px 0 0; }
#msg { font-size: 14px; min-height: 20px; margin: 12px 0 0; } #msg.bad { color: var(--danger); } #msg.good { color: #3fa55a; font-weight: 600; }
a.go { display: block; text-align: center; margin-top: 18px; font-weight: 600; color: #fff; background: var(--accent); border-radius: 10px; padding: 11px; text-decoration: none; }
</style>
</head>
<body>
<form id="f">
  <h1 style="display:flex;align-items:center;gap:10px"><svg viewBox="0 0 120 120" width="30" height="30" aria-hidden="true"><rect width="120" height="120" rx="28" fill="#2f6fe4"/><rect x="22" y="22" width="35" height="35" rx="9" fill="#fff" opacity=".55"/><rect x="63" y="22" width="35" height="35" rx="9" fill="#fff" opacity=".55"/><rect x="22" y="63" width="35" height="35" rx="9" fill="#fff" opacity=".55"/><rect x="63" y="63" width="35" height="35" rx="9" fill="#fff"/><path d="M77 57h14v26l-7-6-7 6z" fill="#f5b83d"/></svg>Save to TileMark</h1>
  <div id="need" hidden><p style="margin-top:14px">Sign in to TileMark to save this link.</p><a class="go" id="signin" href="login">Sign in</a></div>
  <div id="form" hidden>
    <label for="t">Title</label><input id="t" type="text" maxlength="300">
    <p class="url" id="u"></p>
    <label for="g">Group</label><select id="g"></select>
    <label for="n">Note (optional)</label><textarea id="n" maxlength="2000"></textarea>
    <div id="msg" role="status"></div>
    <button id="go" type="submit">Save</button>
  </div>
  <div id="none" hidden><p style="margin-top:14px">No web address was passed to this window.</p><a class="go" href="./">Open TileMark</a></div>
</form>
<script src="i18n.js"></script>
<script>
try { const th = JSON.parse(localStorage.getItem("tm.settings") || "{}").theme; if (th === "light" || th === "dark") document.documentElement.dataset.theme = th; } catch {}
const $ = id => document.getElementById(id), P = new URLSearchParams(location.search);
const text = P.get("text") || "", found = (text.match(/https?:\/\/[^\s<>"']+/) || [])[0];
const url = P.get("u") || P.get("url") || found || "";
const title = P.get("t") || P.get("title") || (found && text.replace(found, "").trim()) || "";
const popup = !!window.opener || window.name === "tilemark-save";
const done = () => { if (popup) window.close(); location.href = "./"; };
async function start() {
  if (!url) { $("none").hidden = false; return; }
  const r = await fetch("api/groups");
  if (r.status === 401) { $("signin").href = "login?next=" + encodeURIComponent("/save" + location.search); $("need").hidden = false; return; }
  const d = await r.json(); let last = ""; try { last = localStorage.getItem("tm.saveGroup") || ""; } catch {}
  const opt = (v, label) => { const o = document.createElement("option"); o.value = v; o.textContent = label; return o; };
  $("g").append(opt("", t("No group")), ...d.groups.map(g => opt(g.id, g.name)));
  if ([...$("g").options].some(o => o.value === last)) $("g").value = last;
  $("t").value = title; $("u").textContent = url; $("form").hidden = false; $("go").focus();
}
$("f").onsubmit = async e => {
  e.preventDefault(); $("go").disabled = true; $("msg").className = ""; $("msg").textContent = "";
  try {
    const r = await fetch("api/links", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ url, title: $("t").value, group_id: +$("g").value || null, note: $("n").value }) });
    const d = await r.json().catch(() => ({}));
    try { localStorage.setItem("tm.saveGroup", $("g").value); } catch {}
    if (r.ok) { $("msg").className = "good"; $("msg").textContent = t("Saved."); setTimeout(done, 900); return; }
    $("msg").className = "bad"; $("msg").textContent = d.error ? t(d.error) : t("Could not save.");
    if (r.status === 409) setTimeout(done, 1600);
  } catch { $("msg").className = "bad"; $("msg").textContent = t("Could not reach TileMark."); }
  $("go").disabled = false;
};
start().catch(() => { $("none").hidden = false; });
</script>
</body>
</html>
